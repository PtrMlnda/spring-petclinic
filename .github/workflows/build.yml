name: build

on:
  push:
    branches:
      - main
      - 'fault/**'
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0 # Fetch whole commit history - required for secret scanning
          persist-credentials: false # Don't leave the git token in the workspace for later steps
      
      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  build:
    needs: workflow-analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Allow to push docker image to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy dependency scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1 # Exit with code 1 if vulnerabilities are found

      - name: Trivy dependency scan (report)
        if: ${{ !cancelled() }} # Generate report even if the previous scan finds vulnerabilities (provided that the workflow is not cancelled)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          format: json
          output: trivy-dependency-report.json
          skip-setup-trivy: true # Skip Trivy setup since it was already set up in the previous step

      - name: Trivy configuration scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: 1
          skip-setup-trivy: true

      - name: Trivy configuration scan (report)
        if: ${{ !cancelled() }} 
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          format: json
          output: trivy-configuration-report.json
          skip-setup-trivy: true 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Specify Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ptrmlnda/petclinic
          tags: | # Create image tag based on commit SHA
            type=sha,format=long       

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false # Don't push the image yet
          load: true # Load the image into the Docker daemon for scanning
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }} 
          cache-from: type=gha
          cache-to: type=gha,mode=max # Cache the layers of the image to speed up future builds

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.tags }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

      - name: Trivy image scan (report)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.tags }}
          scanners: vuln
          format: json
          output: trivy-image-report.json
          skip-setup-trivy: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }} # Push the image only if the workflow is triggered by a push to the main branch
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker image
        if: ${{ github.ref == 'refs/heads/main' }} # Sign the image only if the workflow is triggered by a push to the main branch
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ghcr.io/ptrmlnda/petclinic
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Checkout deploy repository
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          repository: ptrmlnda/petclinic-deploy
          token: ${{ secrets.DEPLOY_PAT }}
          path: deploy

      - name: Update image digest
        if: ${{ github.ref == 'refs/heads/main' }}
        working-directory: deploy
        run: |
          yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' base/deployment.yaml
        env:
          NEW_IMAGE: ghcr.io/ptrmlnda/petclinic@${{ steps.push.outputs.digest }}

      - name: Commit and push changes
        if: ${{ github.ref == 'refs/heads/main' }}
        working-directory: deploy
        run: |
          git config user.name "petclinic-ci"
          git config user.email "petclinic-ci@example.invalid"
          git add base/deployment.yaml
          git diff --cached --quiet || git commit -m "Deploy new image: ${{ steps.push.outputs.digest }}"
          git push

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false # Don't upload the SBOM here since it requires additional write permissions
          upload-release-assets: false # Works only on releases, so we don't use it here

      - name: Upload scan reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-reports
          path: |
            trivy-*.json
            sbom.cdx.json